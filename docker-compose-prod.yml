services:
  paybutton:
    container_name: paybutton-dev
    restart: always
    depends_on:
      - users-service
      - cache
    build: .
    ports:
      - "3000:3000"
      - "5000:5000"
    volumes:
      - .:/home/node/src
      - ./logs:/home/node/.pm2/logs
    command: bash ./scripts/paybutton-server-start.sh

  users-service:
    container_name: paybutton-users-service
    depends_on:
      - cache
    image: registry.supertokens.io/supertokens/supertokens-mysql:10.0.0
    restart: always
    ports:
      - 3567:3567
    environment:
      MYSQL_CONNECTION_URI: "mysql://${SUPERTOKENS_DB_USER}:${SUPERTOKENS_DB_PASSWORD}@${MAIN_DB_HOST}:${MAIN_DB_PORT}/supertokens?useSsl=true&trustServerCertificate=true"

  cache:
    container_name: paybutton-cache
    image: redis:6.2-alpine
    restart: always
    ports:
      - 6379:6379
    volumes:
      - ./redis:/data/redis:z
      - ./scripts:/data/scripts
    command: sh -c "sed -i 's/\\r//g' ./scripts/redis-start.sh && sh ./scripts/redis-start.sh"
